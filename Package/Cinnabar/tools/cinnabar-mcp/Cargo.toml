[package]
name = "cinnabar-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cinnabar-mcp"
path = "src/main.rs"

[package.metadata.cinnabar]
reads = ["Bedform/Contract/automation-v1.schema.json"]

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
getrandom = "0.3"
regex = "1"
developer-control = { path = "../../crates/developer-control" }
diagnostics = { path = "../../crates/diagnostics" }
image.workspace = true
mcp-stdio = { path = "../mcp-stdio" }
render-api = { path = "../../crates/render-api" }
serde = "1"
serde_json = "1"
sha2.workspace = true
tempfile = "3"
time = "0.3"

[lints]
workspace = true

[dev-dependencies]
test-time = { path = "../../crates/test-time" }
